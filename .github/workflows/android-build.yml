name: Android CI - Complete APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info --full-stacktrace --stacktrace --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityNav-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

    - name: Reportar Errores Detallados
      if: failure()
      run: |
        echo "## ❌ Error de Compilación" >> $GITHUB_STEP_SUMMARY
        echo "Revisa los registros para solucionar fallos actuales y prever errores en futuras ramas." >> $GITHUB_STEP_SUMMARY
