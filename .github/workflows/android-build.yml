name: Android CI - Compilación completa de APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --info --full-stacktrace

    - name: Generar Reportaje de Error
      if: failure()
      run: |
        echo "## ❌ Reporte de Error de Compilación" >> $GITHUB_STEP_SUMMARY
        echo "**Estado:** Fallido 🔴" >> $GITHUB_STEP_SUMMARY
        echo "**Detalles:** La compilación del APK fue interrumpida por un error. Revisa el registro (log) del paso *Build with Gradle*." >> $GITHUB_STEP_SUMMARY
        echo "### 🔍 Posibles causas a verificar:" >> $GITHUB_STEP_SUMMARY
        echo "- **Memoria (OOM):** Verifica que \`gradle.properties\` tenga asignada suficiente memoria (ej. \`-Xmx2048m\`)." >> $GITHUB_STEP_SUMMARY
        echo "- **Sintaxis:** Revisa si hay errores de código en los últimos commits enviados." >> $GITHUB_STEP_SUMMARY
        echo "- **Dependencias:** Confirma que las librerías en tu \`build.gradle\` estén bien escritas y accesibles." >> $GITHUB_STEP_SUMMARY
