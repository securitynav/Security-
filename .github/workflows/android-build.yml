name: Android CI - Complete APK Build & Packaging

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Package Backend Bundle for App Assets
        working-directory: tools/backend
        run: |
          if [ -f package.json ]; then
            npm install --production
            tar -czf ../../app/src/main/assets/backend_bundle.tar.gz .
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type full
          fi
          chmod +x gradlew

      - name: Assemble Android APK & Validate Manifest
        run: |
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityNav-Complete-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Complete Backend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SecurityNav-Backend-Bundle
          path: app/src/main/assets/backend_bundle.tar.gz
          retention-days: 7
