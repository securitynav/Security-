name: Android CI - Compilación completa de APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        set -o pipefail
        ./gradlew clean assembleDebug --stacktrace --info 2>&1 | tee build_output.log

    - name: Extraer y Reportar Errores
      if: failure()
      run: |
        echo "## ❌ Reporte Automático de Error" >> $GITHUB_STEP_SUMMARY
        echo "**Estado:** Fallido 🔴" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
        if [ -f build_output.log ]; then
          tail -n 40 build_output.log >> $GITHUB_STEP_SUMMARY
        else
          echo "El archivo build_output.log no se generó. Revisa los pasos anteriores." >> $GITHUB_STEP_SUMMARY
        fi
        echo "```" >> $GITHUB_STEP_SUMMARY
