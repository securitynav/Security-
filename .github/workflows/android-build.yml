name: Android CI - Compilación completa de APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --info --full-stacktrace

    - name: Reportar Errores Detallados
      if: failure()
      run: |
        echo "## ❌ Error de Compilación" >> $GITHUB_STEP_SUMMARY
        echo "Revisa los registros de la pestaña Actions para ver el desglose del fallo." >> $GITHUB_STEP_SUMMARY
